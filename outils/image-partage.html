<!doctype html>
<!--
  Image de partage (og:image, 1200 × 630) : theme/diag-immhauts/assets/img/partage.jpg.
  Pour la refaire : ouvrir ce fichier dans Chrome, fenêtre de 1200 × 630 px (outils de

<html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:Manrope;font-weight:800;src:url(../theme/diag-immhauts/assets/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Manrope;font-weight:700;src:url(../theme/diag-immhauts/assets/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(../theme/diag-immhauts/assets/fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../theme/diag-immhauts/assets/fonts/inter-latin-600-normal.woff2)}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#0b381e}
.carte{position:relative;width:1200px;height:630px;overflow:hidden;background:#0b381e url(../theme/diag-immhauts/assets/img/hero_bg_2000px.webp) no-repeat;background-size:auto 660px;background-position:0 -24px;font-family:Inter,sans-serif;color:#eaf3e6}
.voile{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,63,36,.94) 0,rgba(18,63,36,.84) 38%,rgba(18,63,36,.3) 60%,rgba(18,63,36,0) 74%)}
.int{position:absolute;left:72px;top:64px;bottom:64px;width:680px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px}
.logo svg{width:92px;height:auto}
.mot{font-family:Manrope;font-weight:800;font-size:30px;letter-spacing:-.03em;color:#fff;line-height:1.05}
.sous{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.88);margin-top:4px}
h1{margin-top:auto;font-family:Manrope;font-weight:800;font-size:54px;line-height:1.1;letter-spacing:-.02em;color:#fff}
h1 span{color:#a3e04a}
p{margin-top:22px;font-size:23px;line-height:1.45;font-weight:500;color:#d6e6cf;max-width:560px}
.pastilles{display:flex;gap:12px;margin-top:auto;padding-top:34px}
.pastille{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(163,224,74,.45);font-size:17px;font-weight:600;color:#eaf3e6;white-space:nowrap}
.pastille i{width:8px;height:8px;border-radius:50%;background:#a3e04a}
.pastille--tel{background:#7bc62f;border-color:#7bc62f;color:#123f24;font-family:Manrope;font-weight:800}
</style></head><body><div class="carte"><div class="voile"></div><div class="int">
<div class="logo"><svg viewBox="0 0 404 116" fill="none"><defs><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="404" height="116"><rect width="404" height="116" fill="#fff"/><path d="M130 124 L262 1 L398 124 Z" fill="#000"/></mask></defs><g mask="url(#m)"><path d="M1 124 L138 1 L275 124 L225 124 L138 43 L51 124 Z" fill="#fff"/></g><path d="M130 124 L262 1 L398 124 L348 124 L262 44 L180 124 Z" fill="#a3e04a"/><path d="M290 34 L290 14 L324 9 L324 66 Z" fill="#a3e04a"/></svg>
<div><div class="mot">Diag Imm'Hauts</div><div class="sous">Diagnostics immobiliers</div></div></div>
<h1>Des diagnostics fiables,<br><span>partout dans l'Artois.</span></h1>
<p>Vente, location, copropriétés, audit énergétique : un seul diagnostiqueur certifié.</p>
<div class="pastilles"><span class="pastille"><i></i>Certifié Bureau Veritas</span><span class="pastille"><i></i>Devis sous 24&nbsp;h ouvrées</span><span class="pastille pastille--tel">06 35 88 43 00</span></div>
</div></div></body></html>
